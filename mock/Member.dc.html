<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会員証</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2E22}a:hover{color:#8B2310}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7B92B; font-family: 'Zen Maru Gothic', sans-serif; color: #4A2E22; overflow: hidden">

<main style="flex: 1; min-height: 0; padding: 52px 16px 12px; display: flex; flex-direction: column; gap: 12px">

<button type="button" onClick="{{flip}}" aria-label="{{flipLabel}}" style="padding: 0; text-align: left; background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; overflow: hidden; box-shadow: 0 5px 0 #4A2E22; cursor: pointer; color: #4A2E22; height: 196px; flex-shrink: 0; display: flex; flex-direction: column">
<div style="width: 100%; box-sizing: border-box; background: #4A2E22; color: #FFF3D6; padding: 9px 16px; font-weight: 900; font-size: 15px; display: flex; justify-content: space-between; align-items: center">
<span>{{cardTitle}}</span>
<span style="font-size: 11px; font-weight: 700">タップで{{flipHint}}</span>
</div>
<sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 14px; padding: 14px 16px; width: 100%; box-sizing: border-box">
<div style="width: 92px; height: 116px; flex-shrink: 0; border-radius: 10px; background: #8FAFC4"></div>
<div style="display: flex; flex-direction: column; gap: 7px; min-width: 0">
<div style="display: flex; gap: 4px; flex-wrap: wrap">
<span style="background: #34421C; color: #FFF3D6; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 6px">{{first}}</span>
<span style="background: #8B2310; color: #FFF3D6; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 6px">{{second}}</span>
</div>
<span style="font-size: 22px; font-weight: 900">ゆくらさん</span>
<span style="font-size: 12px; font-weight: 700; color: #6B4A3A">チーム 鍋底同盟 / 最高到達 R3</span>
<span style="font-size: 12px; font-weight: 700; color: #6B4A3A; letter-spacing: 1px">No.123456</span>
</div>
</div>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; box-sizing: border-box; padding: 10px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
<div style="height: 60px; border-radius: 12px; border: 3px solid {{b.border}}; background: {{b.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{b.fg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14l-2 7 5.5-3 5.5 3-2-7"></path></svg>
<span style="font-size: 10px; font-weight: 900; color: {{b.fg}}">{{b.name}}</span>
</div>
</sc-for>
</div>
</sc-if>
</button>

<section aria-labelledby="title-edit" style="background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="title-edit" style="margin: 0; font-size: 16px; font-weight: 900; color: #34421C">二つ名をくみあわせる</h2>
<span style="font-size: 11px; font-weight: 700; color: #6B4A3A">前半 {{firstCount}} / 後半 {{secondCount}} 収集</span>
</div>
<span style="font-size: 12px; font-weight: 900">前半</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{firsts}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" disabled="{{p.locked}}" style="min-height: 36px; padding: 0 10px; border-radius: 10px; border: 2px {{p.borderStyle}} {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 900; cursor: pointer">{{p.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 900">後半</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{seconds}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" disabled="{{p.locked}}" style="min-height: 36px; padding: 0 10px; border-radius: 10px; border: 2px {{p.borderStyle}} {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 900; cursor: pointer">{{p.label}}</button>
</sc-for>
</div>
</section>

<section aria-labelledby="chara-edit" style="flex: 1; min-height: 0; background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; padding: 10px 14px; display: flex; gap: 10px; align-items: center">
<svg role="img" aria-label="自分のキャラクターのプレビュー" width="110" height="120" viewBox="0 0 200 210" style="flex-shrink: 0">
<path d="M56 206 c0 -54 20 -80 44 -80 s44 26 44 80z" fill="{{outfit}}" stroke="#4A2E22" stroke-width="5"></path>
<circle cx="100" cy="82" r="48" fill="#FBE6C8" stroke="#4A2E22" stroke-width="5"></circle>
<path d="M53 70 q47 -18 94 0 l-2 14 q-45 -16 -90 0z" fill="{{band}}" stroke="#4A2E22" stroke-width="3" stroke-linejoin="round"></path>
<path d="M146 72 l22 -10 l-4 14 l14 6 l-26 2z" fill="{{band}}" stroke="#4A2E22" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="84" cy="98" r="5" fill="#4A2E22"></circle>
<circle cx="116" cy="98" r="5" fill="#4A2E22"></circle>
<path d="M90 114 q10 8 20 0" fill="none" stroke="#4A2E22" stroke-width="5" stroke-linecap="round"></path>
</svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h2 id="chara-edit" style="margin: 0; font-size: 15px; font-weight: 900; color: #34421C">自分のキャラの編集</h2>
<span style="font-size: 12px; font-weight: 900">はちまき</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{bands}}" as="c" hint-placeholder-count="4">
<button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; border-radius: 50%; background: {{c.hex}}; border: 3px solid #4A2E22; box-shadow: {{c.ring}}; cursor: pointer"></button>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 900">ふく</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{outfits}}" as="c" hint-placeholder-count="4">
<button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; border-radius: 50%; background: {{c.hex}}; border: 3px solid #4A2E22; box-shadow: {{c.ring}}; cursor: pointer"></button>
</sc-for>
</div>
</div>
</section>
</main>

<nav style="height: 76px; flex-shrink: 0; display: flex; border-top: 3px solid #4A2E22; background: #FFF3D6">
<a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4A2E22; font-size: 12px; font-weight: 900">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
ホーム</a>
<a href="Ranking.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4A2E22; font-size: 12px; font-weight: 900; border-left: 3px solid #4A2E22">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><rect x="5" y="11" width="4" height="9"></rect><rect x="10" y="6" width="4" height="14"></rect><rect x="15" y="14" width="4" height="6"></rect></svg>
ランキング</a>
<a href="Member.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #F7B92B; text-decoration: none; color: #4A2E22; font-size: 12px; font-weight: 900; border-left: 3px solid #4A2E22">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c1-2 5-2 6 0"></path><path d="M14 10h4M14 14h3"></path></svg>
会員証</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { back: false, first: '芋煮会の', second: '初心者', band: '#8B2310', outfit: '#FFF3D6' };
  }
  parts(list, key, color) {
    return list.map((p) => {
      const on = this.state[key] === p.text;
      if (!p.got) return { label: '???', pressed: 'false', locked: true, borderStyle: 'dashed', border: '#8C6A2E', bg: '#EFE3C8', fg: '#5C4518', pick: () => {} };
      return { label: p.text, pressed: on ? 'true' : 'false', locked: false, borderStyle: 'solid', border: on ? color : '#4A2E22', bg: on ? color : '#FFFFFF', fg: on ? '#FFF3D6' : '#4A2E22', pick: () => this.setState({ [key]: p.text }) };
    });
  }
  swatches(list, key) {
    return list.map((c) => {
      const on = this.state[key] === c.hex;
      return { ...c, pressed: on ? 'true' : 'false', ring: on ? '0 0 0 3px #FFF3D6, 0 0 0 6px #34421C' : 'none', pick: () => this.setState({ [key]: c.hex }) };
    });
  }
  renderVals() {
    const back = this.state.back;
    const firsts = [
      { text: '芋煮会の', got: true }, { text: '山の', got: true }, { text: '連続の', got: true },
      { text: '伝説の', got: false }, { text: '神話の', got: false }, { text: '究極の', got: false }
    ];
    const seconds = [
      { text: '初心者', got: true }, { text: '薪割り職人', got: true }, { text: '里芋ハンター', got: true },
      { text: '鍋奉行', got: false }, { text: '採集王', got: false }, { text: '芋煮マスター', got: false }
    ];
    const badgeData = [
      { name: 'はじめの一歩', got: true }, { name: 'R3到達', got: true }, { name: '10連続', got: true },
      { name: '5連続成功', got: false }, { name: '1億点', got: false }, { name: '究極品質', got: false }
    ];
    return {
      front: !back, back: back,
      cardTitle: back ? '達成したバッジ 3/6' : 'リモート芋煮会 会員証',
      flipHint: back ? '会員証へ' : 'バッジを見る',
      flipLabel: back ? '会員証の表に戻す' : '達成したバッジを見る',
      flip: () => this.setState({ back: !back }),
      first: this.state.first, second: this.state.second,
      firsts: this.parts(firsts, 'first', '#34421C'),
      seconds: this.parts(seconds, 'second', '#8B2310'),
      firstCount: firsts.filter((p) => p.got).length + '/' + firsts.length,
      secondCount: seconds.filter((p) => p.got).length + '/' + seconds.length,
      badges: badgeData.map((b) => ({ name: b.got ? b.name : '???', bg: b.got ? '#F7B92B' : '#EFE3C8', border: b.got ? '#4A2E22' : '#B8A586', fg: b.got ? '#4A2E22' : '#6B5A45' })),
      band: this.state.band, outfit: this.state.outfit,
      bands: this.swatches([
        { hex: '#8B2310', label: 'はちまき あか' }, { hex: '#34421C', label: 'はちまき みどり' },
        { hex: '#2F5D8A', label: 'はちまき あお' }, { hex: '#FFFFFF', label: 'はちまき しろ' }
      ], 'band'),
      outfits: this.swatches([
        { hex: '#FFF3D6', label: 'ふく きなり' }, { hex: '#6B9B3A', label: 'ふく わかくさ' },
        { hex: '#C9A27A', label: 'ふく つち' }, { hex: '#8FAFC4', label: 'ふく そら' }
      ], 'outfit')
    };
  }
}
</script>
</body>
</html>
