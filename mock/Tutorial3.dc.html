<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>品質と連続ボーナス</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2E22}a:hover{color:#8B2310}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 22px 48px; background: #F7B92B; font-family: 'Zen Maru Gothic', sans-serif; color: #4A2E22; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 18px; color: #8B2310">(3/3)</span>
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: 24px; line-height: 1.45; color: #34421C">自分を強化して、<br>とんでもない芋煮をつくろう!</h1>
</div>

<div style="background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 900">品質で価値が何倍にも</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{qualities}}" as="q" hint-placeholder-count="7">
<span style="background: {{q.bg}}; color: {{q.fg}}; border: 2px solid #4A2E22; font-size: 12px; font-weight: 900; padding: 4px 8px; border-radius: 8px">{{q.name}} ×{{q.mul}}</span>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 700; color: #6B4A3A">上位の品質はラウンドが進むと解放されるよ</span>
</div>

<div style="background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
<svg role="img" aria-label="はちまきを締めた応援キャラクター" width="96" height="100" viewBox="0 0 200 210" style="flex-shrink: 0">
<path d="M60 200 c0 -50 20 -74 40 -74 s40 24 40 74z" fill="#FFF3D6" stroke="#4A2E22" stroke-width="5"></path>
<circle cx="100" cy="82" r="48" fill="#FBE6C8" stroke="#4A2E22" stroke-width="5"></circle>
<path d="M53 70 q47 -18 94 0 l-2 14 q-45 -16 -90 0z" fill="#8B2310" stroke="#4A2E22" stroke-width="3" stroke-linejoin="round"></path>
<path d="M146 72 l22 -10 l-4 14 l14 6 l-26 2z" fill="#8B2310" stroke="#4A2E22" stroke-width="3" stroke-linejoin="round"></path>
<path d="M78 98 l12 4 M122 98 l-12 4" stroke="#4A2E22" stroke-width="5" stroke-linecap="round"></path>
<path d="M90 114 q10 8 20 0" fill="none" stroke="#4A2E22" stroke-width="5" stroke-linecap="round"></path>
</svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 900">最高品質の連続ボーナス</span>
<span style="font-size: 13px; font-weight: 700; line-height: 1.5">最高品質を続けて引くほど、獲得数とポイントが倍々に増える!途切れると0から。</span>
</div>
</div>

<div style="background: #FFF3D6; border: 3px solid #4A2E22; border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ups}}" as="u" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 900; color: #34421C">{{u.name}}</span>
<span style="font-size: 11px; font-weight: 700; color: #6B4A3A">{{u.desc}}</span>
</div>
</sc-for>
</div>

<p style="margin: 0; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-size: 20px; color: #8B2310">ねばれ、きばれ、がんばれ!</p>

<div style="flex: 1"></div>
<div style="display: flex; justify-content: center; gap: 8px" aria-hidden="true">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #FFF3D6"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #FFF3D6"></span>
<span style="width: 24px; height: 8px; border-radius: 4px; background: #34421C"></span>
</div>
<a href="Home.dc.html" style="height: 64px; border-radius: 999px; background: #34421C; color: #FFF3D6; font-family: 'Dela Gothic One', sans-serif; font-size: 24px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #1E2610">はじめる</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      qualities: [
        { name: '普通', mul: '1', bg: '#FFFFFF', fg: '#4A2E22' },
        { name: '良質', mul: '2', bg: '#DCE8C4', fg: '#34421C' },
        { name: '希少', mul: '5', bg: '#C8DCEB', fg: '#1F3E5C' },
        { name: '伝説', mul: '20', bg: '#F7B92B', fg: '#4A2E22' },
        { name: '神話', mul: '100', bg: '#B5652B', fg: '#FFF3D6' },
        { name: '超越', mul: '1,000', bg: '#8B2310', fg: '#FFF3D6' },
        { name: '究極', mul: '10,000', bg: '#4A2E22', fg: '#F7B92B' }
      ],
      ups: [
        { name: '移動速度', desc: '目的地まで早く着く' },
        { name: '採集速度', desc: '採集が早く終わる' },
        { name: '採集量', desc: '1回でたくさん取れる' },
        { name: '採集運', desc: '高品質が出やすい' }
      ]
    };
  }
}
</script>
</body>
</html>
