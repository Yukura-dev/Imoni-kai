<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゲームオーバー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFF3D6}a:hover{color:#F7B92B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 18px 36px; background: #4A2E22; font-family: 'Zen Maru Gothic', sans-serif; color: #FFF3D6; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; background: #FFF3D6; color: #4A2E22; font-size: 13px; font-weight: 900; padding: 5px 12px; border-radius: 999px">ラウンド 3/5 結果</span>
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: 34px; line-height: 1.3; color: #F7B92B">芋煮会 失敗…</h1>
<p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.6">必須素材が足りなくて、芋煮が完成しなかった。</p>

<section aria-labelledby="miss" style="background: #FFF3D6; color: #4A2E22; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<h2 id="miss" style="margin: 0; font-size: 14px; font-weight: 900">必須素材(品質換算)</h2>
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 96px; gap: 8px; align-items: center">
<span style="font-size: 13px; font-weight: 900">{{r.name}}</span>
<div style="height: 8px; border-radius: 999px; background: #E9D5AE; overflow: hidden"><div style="height: 100%; width: {{r.pct}}%; background: {{r.bar}}"></div></div>
<span style="font-size: 12px; font-weight: 900; text-align: right; color: {{r.fg}}">{{r.val}}</span>
</div>
</sc-for>
</section>

<section aria-labelledby="reset" style="border: 3px dashed #F7B92B; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<h2 id="reset" style="margin: 0; font-size: 14px; font-weight: 900; color: #F7B92B">リセットされるもの</h2>
<span style="font-size: 13px; font-weight: 700">・共有倉庫の素材 / 共有資金</span>
<span style="font-size: 13px; font-weight: 700">・全員の個人強化 / 連続記録</span>
<span style="font-size: 13px; font-weight: 700">・マップ(新しいランダムマップで再挑戦)</span>
<span style="font-size: 13px; font-weight: 900; color: #F7B92B">・今回の挑戦はランキングに登録されません</span>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="background: #5E3D2E; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700">今回の到達</span><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 20px">R3</span></div>
<div style="background: #5E3D2E; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700">累積スコア(参考)</span><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 20px">84.2万</span></div>
</div>

<div style="flex: 1"></div>
<a href="Game.dc.html" style="height: 60px; border-radius: 999px; background: #F7B92B; color: #4A2E22; font-family: 'Dela Gothic One', sans-serif; font-size: 22px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #8C6A2E">R1から再挑戦</a>
<a href="Home.dc.html" style="height: 44px; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">ホームへ戻る</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { bar: '#6B9B3A', fg: '#34421C' };
    const ng = { bar: '#8B2310', fg: '#8B2310' };
    return {
      reqs: [
        { name: '薪', val: '4,820/4,500', pct: 100, ...ok },
        { name: '魚', val: '312/400 不足', pct: 78, ...ng },
        { name: 'キノコ', val: '1,050/900', pct: 100, ...ok }
      ]
    };
  }
}
</script>
</body>
</html>
