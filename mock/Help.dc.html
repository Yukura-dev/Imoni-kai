<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>遊び方</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2E22}a:hover{color:#8B2310}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 18px 28px; background: #F7B92B; font-family: 'Zen Maru Gothic', sans-serif; color: #4A2E22; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 8px">
<a href="Home.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 900; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A2E22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
戻る</a>
<h1 style="margin: 0 0 0 4px; font-family: 'Dela Gothic One', sans-serif; font-size: 26px; color: #34421C">遊び方</h1>
</div>

<div role="tablist" aria-label="項目" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height: 56px; padding: 6px 0 4px; border-radius: 12px; border: 3px solid #4A2E22; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
{{t.label}}</button>
</sc-for>
</div>

<section aria-labelledby="help-title" style="flex: 1; min-height: 0; background: #FFF3D6; border: 4px solid #4A2E22; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #4A2E22; color: #FFF3D6; padding: 10px 16px; display: flex; justify-content: space-between; align-items: baseline">
<h2 id="help-title" style="margin: 0; font-size: 17px; font-weight: 900">{{title}}</h2>
<span style="font-size: 12px; font-weight: 700; color: #DCC9A8">{{page}} / 5</span>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; font-weight: 700; line-height: 1.6; color: #6B4A3A">{{lead}}</p>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: {{s.color}}; display: flex; align-items: center; justify-content: center; position: relative">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
<span style="position: absolute; left: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: #F7B92B; border: 2px solid #4A2E22; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{s.no}}</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 900">{{s.title}}</span>
<span style="font-size: 13px; font-weight: 700; line-height: 1.6">{{s.desc}}</span>
<sc-if value="{{s.hasChips}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px">
<sc-for list="{{s.chips}}" as="c" hint-placeholder-count="4">
<span style="background: {{c.bg}}; color: {{c.fg}}; border: 2px {{c.border}} {{c.line}}; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 7px">{{c.text}}</span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{s.hasNote}}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; font-size: 12px; font-weight: 900; color: #8B2310; background: #FBE3DC; border-radius: 8px; padding: 3px 8px">{{s.note}}</span>
</sc-if>
</div>
</div>
</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{prev}}" disabled="{{isFirst}}" style="height: 52px; border-radius: 999px; border: 3px solid {{prevLine}}; background: transparent; color: {{prevLine}}; font-size: 16px; font-weight: 900; cursor: pointer">‹ 前へ</button>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{next}}" style="height: 52px; border-radius: 999px; border: 0; background: #34421C; color: #FFF3D6; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #1E2610">次へ ›</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="Home.dc.html" style="height: 52px; border-radius: 999px; background: #34421C; color: #FFF3D6; font-size: 16px; font-weight: 900; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #1E2610">わかった!</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"section":{"editor":"enum","options":[0,1,2,3,4],"default":0},"$preview":{"width":390,"height":844}}'>
const I = {
  tap: 'M9 11V5.5a1.5 1.5 0 0 1 3 0V11 M12 10.5a1.5 1.5 0 0 1 3 0V12 M15 11.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-2L9 15',
  flow: 'M12 3a9 9 0 1 0 0.01 0 M12 7v5l3 2',
  box: 'M3 8l9-4 9 4v10l-9 4-9-4z M3 8l9 4 9-4 M12 12v10',
  up: 'M12 20V5 M5 12l7-7 7 7',
  rank: 'M4 20h16 M5 11h4v9H5z M10 6h4v14h-4z M15 14h4v6h-4z',
  tree: 'M12 22v-6 M12 3a6 6 0 0 1 6 6 5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5 6 6 0 0 1 6-6z',
  repeat: 'M17 2l4 4-4 4 M3 11V9a3 3 0 0 1 3-3h15 M7 22l-4-4 4-4 M21 13v2a3 3 0 0 1-3 3H3',
  turn: 'M4 18h7a5 5 0 0 0 5-5V6 M12 10l4-4 4 4',
  team: 'M8 11a3 3 0 1 0 0.01 0 M16 11a3 3 0 1 0 0.01 0 M2 21c0-3 3-5 6-5s6 2 6 5 M12 21c0-3 2-5 5-5s5 2 5 5',
  start: 'M5 4l14 8-14 8z',
  bonus: 'M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21.1l1.5-7L2 9.3l7-.8z',
  pot: 'M3 10h18 M5 10v4a7 5 0 0 0 14 0v-4 M1 10h2 M21 10h2 M9 6c0-1 1-1 1-2 M14 6c0-1 1-1 1-2',
  flag: 'M5 21V4 M5 4h11l-2 4 2 4H5',
  coin: 'M12 3a9 9 0 1 0 0.01 0 M9 9h6 M9 13h6 M12 9v9',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',
  warn: 'M12 3l10 18H2z M12 10v5 M12 18v.5',
  shop: 'M5 8h14l-1 12H6z M9 8V6a3 3 0 0 1 6 0v2',
  gem: 'M6 3h12l4 6-10 12L2 9z M2 9h20 M9 3l3 18 3-18',
  fire: 'M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 8-1-1-2-2-2-4-2 2-3 5-3 8 0 4 3 7 7 7z',
  calc: 'M5 3h14v18H5z M8 7h8 M8 12h2 M14 12h2 M8 16h2 M14 16h2',
  medal: 'M12 9a6 6 0 1 0 0.01 0 M8.5 14l-2 7 5.5-3 5.5 3-2-7',
  tag: 'M3 12V4h8l10 10-8 8z M7.5 7.5v.5'
};
const G = '#34421C', O = '#B5652B', R = '#8B2310', B = '#2F5D8A';
const SECTIONS = [
  {
    tab: '操作', icon: I.tap, title: '1. 基本の操作', lead: '指1本で遊べるよ。資源をタップするだけで、キャラが自動で動いてくれる。',
    steps: [
      { icon: I.tree, color: G, title: '資源をタップ', desc: '木・里芋・ねぎ・キノコなどをタップすると、自分のキャラが歩いていって自動で採集するよ。' },
      { icon: I.repeat, color: O, title: '取り切るまで自動で続ける', desc: '1回で数個ずつ採れて、取り切ると切り株に。約40秒でまた生えてくるよ。' },
      { icon: I.turn, color: B, title: '行き先はいつでも変えられる', desc: '移動中や採集中でも、別の資源をタップすればそちらへ向かうよ。' },
      { icon: I.team, color: R, title: '素材はチームの共有倉庫へ', desc: '誰が採っても、チーム全員の倉庫に入るよ。灰色のエリアは、ラウンドが進むと行けるようになる。' }
    ]
  },
  {
    tab: '流れ', icon: I.flow, title: '2. ラウンドの流れ', lead: '1ラウンドは5分。5ラウンド連続で芋煮会を成功させるとクリア!',
    steps: [
      { icon: I.start, color: G, title: '0:00 必須素材の発表', desc: '画面上に、集める素材と数が出るよ。数は品質で増える「品質換算」で数えるよ。' },
      { icon: I.bonus, color: O, title: '2:00 ボーナス素材の発表', desc: '目標の100%で報酬。150%・200%・300%でさらに倍になるよ。' },
      { icon: I.pot, color: R, title: '5:00 芋煮会!', desc: '倉庫の素材は全部自動で鍋へ。必須素材がそろえば成功、足りないと失敗。' },
      { icon: I.flag, color: B, title: '成功と失敗', desc: '成功すると資金と強化を引き継いで次のラウンドへ。失敗すると全部リセットして、新しいマップでR1から。', note: '5連続成功の先はエンドレスモード' }
    ]
  },
  {
    tab: '倉庫', icon: I.box, title: '3. 倉庫とお金', lead: '下の「倉庫」ボタンで、チームの素材を確認・売却できるよ。',
    steps: [
      { icon: I.coin, color: G, title: '売ってお金(G)に', desc: '素材を選んで、割合(25〜100%)か数を決めて売るよ。確認なしですぐ売れて、チームの資金になる。' },
      { icon: I.shield, color: B, title: '使う分は「保護」', desc: '芋煮会で使う分を保護すると、売りすぎを防げるよ。保護した素材も芋煮会にはちゃんと入る。' },
      { icon: I.warn, color: R, title: '売った素材はスコアに入らない', desc: '売れば資金は増えるけど、芋煮会には使えないよ。', note: '必須素材は売りすぎに注意!' },
      { icon: I.shop, color: O, title: '足りないときはショップ', desc: '下の「ショップ」で素材を買えるよ(品質は普通)。' }
    ]
  },
  {
    tab: '強化', icon: I.up, title: '4. 強化と品質', lead: '資金で自分を強化して、たくさん・高品質に集めよう。',
    steps: [
      { icon: I.up, color: G, title: '4つの強化', desc: '移動速度・採集速度・採集量・採集運。強化は自分だけに効くよ。資金はチーム共通なので、相談して使おう。' },
      { icon: I.gem, color: B, title: '品質で価値が何倍にも', desc: '高い品質ほど、1個で何個分にもなるよ。上の品質はラウンドが進むと出るようになる。', chips: true },
      { icon: I.fire, color: R, title: '最高品質の連続ボーナス', desc: 'そのラウンドの最高品質を続けて引くと、獲得数とポイントが倍々に。左上の「最高品質 連続」で確認できるよ。' }
    ]
  },
  {
    tab: 'スコア', icon: I.rank, title: '5. スコアとランキング', lead: '大きなスコアを出して、チームでランキング上位をめざそう。',
    steps: [
      { icon: I.calc, color: G, title: '芋煮会のスコア', desc: '必須素材のポイントと、ボーナス素材のポイント×段階(×1〜×8)で決まるよ。品質と連続ボーナスでどんどん増える!' },
      { icon: I.rank, color: B, title: 'チームランキング', desc: '5ラウンド連続で成功した挑戦が登録されるよ。みんな同じマップの「共通シード部門」と「自由シード部門」がある。' },
      { icon: I.tag, color: R, title: '二つ名を集めよう', desc: '活躍すると、二つ名の「前半」「後半」のパーツが手に入るよ。会員証で組み合わせよう。' }
    ]
  }
];
const QUALITY_CHIPS = [
  { text: '普通 ×1', bg: '#FFFFFF', fg: '#4A2E22' }, { text: '良質 ×2', bg: '#DCE8C4', fg: '#34421C' },
  { text: '希少 ×5', bg: '#C8DCEB', fg: '#1F3E5C' }, { text: '伝説 ×20', bg: '#F7B92B', fg: '#4A2E22' },
  { text: '???', bg: '#EFE3C8', fg: '#6B5A45', locked: true }, { text: '???', bg: '#EFE3C8', fg: '#6B5A45', locked: true }, { text: '???', bg: '#EFE3C8', fg: '#6B5A45', locked: true }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sec: Number(props.section ?? 0) || 0 }; }
  renderVals() {
    const i = Math.max(0, Math.min(4, this.state.sec));
    const s = SECTIONS[i];
    return {
      tabs: SECTIONS.map((x, k) => ({ label: x.tab, icon: x.icon, selected: k === i ? 'true' : 'false', bg: k === i ? '#34421C' : '#FFF3D6', fg: k === i ? '#FFF3D6' : '#4A2E22', pick: () => this.setState({ sec: k }) })),
      title: s.title, lead: s.lead, page: i + 1,
      steps: s.steps.map((st, k) => ({
        no: k + 1, icon: st.icon, color: st.color, title: st.title, desc: st.desc,
        hasNote: !!st.note, note: st.note || '',
        hasChips: !!st.chips, chips: st.chips ? QUALITY_CHIPS.map(c => ({ ...c, border: c.locked ? 'dashed' : 'solid', line: c.locked ? '#8C6A2E' : '#4A2E22' })) : []
      })),
      isFirst: i === 0, prevLine: i === 0 ? '#C29A3A' : '#4A2E22', isLast: i === 4, notLast: i < 4,
      prev: () => this.setState({ sec: Math.max(0, i - 1) }),
      next: () => this.setState({ sec: Math.min(4, i + 1) })
    };
  }
}
</script>
</body>
</html>
